<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="morphlo — never worry about converting again">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cf6" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#4533db" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4533db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="1" y="1" width="718" height="198" rx="18"/></clipPath>
    <clipPath id="wipe">
      <rect x="168" y="30" width="350" height="140">
        <animate attributeName="width" values="0;0;350" keyTimes="0;0.13;1" dur="1.15s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="718" height="198" rx="18" fill="#0a0a0a" stroke="#262626" stroke-width="1.5"/>

  <g clip-path="url(#panel)">
    <!-- halo behind the mark -->
    <circle cx="100" cy="100" r="96" fill="url(#halo)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
  </g>

  <!-- mark: dark tile + violet butterfly -->
  <rect x="54" y="54" width="92" height="92" rx="24" fill="url(#tile)" stroke="#2e2e2e" stroke-width="1.2"/>
  <g transform="translate(100 100)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;0.78 1;1 1;1 1" keyTimes="0;0.12;0.26;1" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.16 1 0.3 1;0 0 1 1"/>
      <g transform="scale(3.6) translate(-9 -9)" fill="none" stroke="#8b6cf6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M9 9C7 5 3 1.5 2 3C.5 6 5 8.5 9 9M9 9C6 10.5 2 13 3.5 15C5.5 16.5 8.5 13 9 9M9 9C11 5 15 1.5 16 3C17.5 6 13 8.5 9 9M9 9C12 10.5 16 13 14.5 15C12.5 16.5 9.5 13 9 9" stroke-width="1.6"/>
        <path d="M9 5V14" stroke-width="1.4" stroke="#b9a7ff"/>
      </g>
    </g>
  </g>

  <!-- wordmark + subline (wipe in) -->
  <g clip-path="url(#wipe)">
    <text x="174" y="106" font-family="Geist, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#fafafa">morphlo</text>
    <path d="M177 124 H393" stroke="#8b6cf6" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="216" stroke-dashoffset="0" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="216;216;0" keyTimes="0;0.36;1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/>
    </path>
    <text x="177" y="150" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="14.5" fill="#737373"><tspan fill="#8b6cf6">›</tspan> never worry about converting again</text>
  </g>

  <!-- morphing file chip -->
  <g font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="610" y="70" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#525252">ANY FILE · ANY FORMAT</text>
    <rect x="528" y="82" width="164" height="38" rx="10" fill="#111111" stroke="#262626" stroke-width="1.2">
      <animate attributeName="stroke" values="#262626;#8b6cf6;#262626;#262626;#8b6cf6;#262626;#262626;#8b6cf6;#262626;#262626;#8b6cf6;#262626;#262626" keyTimes="0;0.02;0.08;0.23;0.27;0.33;0.48;0.52;0.58;0.73;0.77;0.83;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="546" cy="101" r="3.2" fill="#3fdd86">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g font-size="14" text-anchor="middle">
      <text x="619" y="106" opacity="1"><tspan fill="#a3a3a3">.heic</tspan><tspan fill="#525252"> → </tspan><tspan fill="#8b6cf6">.jpg</tspan>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.25;0.98;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="619" y="106" opacity="0"><tspan fill="#a3a3a3">.mov</tspan><tspan fill="#525252"> → </tspan><tspan fill="#8b6cf6">.mp4</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.48;0.5;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="619" y="106" opacity="0"><tspan fill="#a3a3a3">.wav</tspan><tspan fill="#525252"> → </tspan><tspan fill="#8b6cf6">.flac</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.73;0.75;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="619" y="106" opacity="0"><tspan fill="#a3a3a3">.docx</tspan><tspan fill="#525252"> → </tspan><tspan fill="#8b6cf6">.pdf</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.76;0.98;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="610" y="142" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#525252">100% ON YOUR MAC</text>
  </g>
</svg>
