<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Morphlo demo: a photo named IMG_0464.HEIC is dragged out of Apple Photos into an AI chat in the browser. Mid-drag its name changes to IMG_0464.jpg, and it lands in the chat composer as a JPEG attachment with a green check. Without Morphlo the chat would reject it as an unsupported file type (.heic).">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="0.45" stop-color="#ea580c"/><stop offset="1" stop-color="#3b1d4a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="0.55" stop-color="#0369a1"/><stop offset="1" stop-color="#0b1e33"/></linearGradient>
    <linearGradient id="for" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#a3c46b"/><stop offset="0.5" stop-color="#3f6212"/><stop offset="1" stop-color="#0b2412"/></linearGradient>
    <linearGradient id="snd" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f1e4c8"/><stop offset="0.55" stop-color="#c7a573"/><stop offset="1" stop-color="#5c4329"/></linearGradient>
    <linearGradient id="slt" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset="0.5" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#99f6e4"/><stop offset="0.55" stop-color="#0f766e"/><stop offset="1" stop-color="#062e2b"/></linearGradient>
    <linearGradient id="ems" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="0.6" stop-color="#c2410c"/><stop offset="1" stop-color="#431407"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#1a1a1a"/></pattern>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111111" stop-opacity="0"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <clipPath id="frame"><rect width="980" height="560" rx="14"/></clipPath>
    <clipPath id="photosBody"><rect x="24" y="60" width="440" height="404"/></clipPath>
    <clipPath id="thumbClip"><rect x="-42" y="-42" width="84" height="84" rx="10"/></clipPath>
    <clipPath id="chipThumb"><rect x="528" y="370" width="32" height="32" rx="7"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
